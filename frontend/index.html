<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberVerse | Enter The Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        .cyber-font {
            font-family: 'Orbitron', monospace;
        }
        
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0a0f 0%, #0a0a1a 50%, #0a0a0f 100%);
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
        }
        
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            50% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
        }
        
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(0, 255, 255, 0.3); box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); }
            50% { border-color: rgba(0, 255, 255, 0.8); box-shadow: 0 0 40px rgba(0, 255, 255, 0.3); }
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .glow-text {
            animation: glowPulse 2s ease-in-out infinite;
        }
        
        .cyber-card {
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 24px;
            animation: borderGlow 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        
        .cyber-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            border-radius: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }
        
        .cyber-card:hover::before {
            opacity: 0.3;
        }
        
        .cyber-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 14px 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .cyber-input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            outline: none;
        }
        
        .cyber-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .cyber-button {
            background: linear-gradient(135deg, #00ffff, #0066ff);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .tab-btn.active {
            color: #00ffff;
        }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { width: 0; }
            to { width: 100%; }
        }
        
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .main-container {
            min-height: 100vh;
            padding: 60px 20px;
        }
        
        .content-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .left-section {
            padding: 40px;
        }
        
        .main-title {
            font-size: 72px;
            line-height: 1.2;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .main-title { font-size: 48px; }
            .left-section { padding: 20px; }
            .main-container { padding: 40px 20px; }
        }
        
        @media (max-width: 768px) {
            .main-title { font-size: 36px; }
            .cyber-card { margin-top: 30px; }
            .tab-btn { padding: 8px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div id="matrix-bg"></div>
    
    <div class="main-container relative z-10">
        <div class="content-wrapper">
            <div class="grid lg:grid-cols-2 gap-12 items-center">
                <!-- Left Side -->
                <div class="left-section space-y-8">
                    <div class="relative">
                        <h1 class="main-title font-black cyber-font glow-text tracking-wider">
                            CYBER<span class="text-cyan-400">VERSE</span>
                        </h1>
                        <div class="absolute -top-12 -right-12 floating-icon">
                            <i class="fas fa-shield-hooded text-7xl text-cyan-400 opacity-40"></i>
                        </div>
                    </div>
                    
                    <p class="text-2xl text-cyan-300 font-medium">Welcome to the Digital Frontier</p>
                    
                    <div class="space-y-4 text-gray-300">
                        <div class="flex items-center space-x-3 group">
                            <div class="w-2 h-2 bg-cyan-400 rounded-full group-hover:animate-ping"></div>
                            <span class="group-hover:text-cyan-400 transition text-lg">🔒 9 Advanced Security Tools</span>
                        </div>
                        <div class="flex items-center space-x-3 group">
                            <div class="w-2 h-2 bg-cyan-400 rounded-full group-hover:animate-ping"></div>
                            <span class="group-hover:text-cyan-400 transition text-lg">🛡️ Real-time Threat Detection</span>
                        </div>
                        <div class="flex items-center space-x-3 group">
                            <div class="w-2 h-2 bg-cyan-400 rounded-full group-hover:animate-ping"></div>
                            <span class="group-hover:text-cyan-400 transition text-lg">📊 Comprehensive Security Analysis</span>
                        </div>
                        <div class="flex items-center space-x-3 group">
                            <div class="w-2 h-2 bg-cyan-400 rounded-full group-hover:animate-ping"></div>
                            <span class="group-hover:text-cyan-400 transition text-lg">⚡ Instant Results & Reports</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-6 pt-8">
                        <div class="cyber-card p-5 text-center">
                            <div class="text-3xl font-bold text-cyan-400">9+</div>
                            <div class="text-sm text-gray-400 mt-1">Security Tools</div>
                        </div>
                        <div class="cyber-card p-5 text-center">
                            <div class="text-3xl font-bold text-cyan-400">24/7</div>
                            <div class="text-sm text-gray-400 mt-1">Active Protection</div>
                        </div>
                    </div>
                    
                    <div class="flex space-x-2 pt-4">
                        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
                        <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse" style="animation-delay: 0.6s"></div>
                    </div>
                </div>

                <!-- Right Side - Login/Signup Card -->
                <div class="cyber-card p-8 md:p-10" style="animation: slideInRight 0.8s ease-out;">
                    <div class="flex gap-4 mb-10 border-b border-cyan-500/30 pb-4">
                        <button class="tab-btn active text-cyan-400 flex-1" data-tab="login">
                            <i class="fas fa-sign-in-alt mr-2"></i>LOGIN
                        </button>
                        <button class="tab-btn text-gray-400 flex-1" data-tab="signup">
                            <i class="fas fa-user-plus mr-2"></i>SIGNUP
                        </button>
                    </div>

                    <!-- Login Form -->
                    <div id="login-form" class="tab-content space-y-6">
                        <form id="loginForm" class="space-y-5">
                            <div class="relative">
                                <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400"></i>
                                <input type="text" id="loginUsername" required class="cyber-input pl-12" placeholder="Username">
                            </div>
                            <div class="relative">
                                <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400"></i>
                                <input type="password" id="loginPassword" required class="cyber-input pl-12" placeholder="Password">
                            </div>
                            <button type="submit" class="cyber-button w-full mt-6">
                                <i class="fas fa-arrow-right-to-bracket mr-2"></i>ENTER CYBERVERSE
                            </button>
                        </form>
                        <div id="loginError" class="text-red-400 text-center text-sm hidden"></div>
                        <div class="text-center text-xs text-gray-500 pt-4">
                            <i class="fas fa-shield-alt mr-1"></i> Secure authentication with AES-256
                        </div>
                    </div>

                    <!-- Signup Form -->
                    <div id="signup-form" class="tab-content hidden space-y-6">
                        <form id="signupForm" class="space-y-5">
                            <div class="relative">
                                <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400"></i>
                                <input type="text" id="signupUsername" required class="cyber-input pl-12" placeholder="Username">
                            </div>
                            <div class="relative">
                                <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400"></i>
                                <input type="email" id="signupEmail" required class="cyber-input pl-12" placeholder="Email">
                            </div>
                            <div class="relative">
                                <i class="fas fa-key absolute left-4 top-1/2 transform -translate-y-1/2 text-cyan-400"></i>
                                <input type="password" id="signupPassword" required class="cyber-input pl-12" placeholder="Password (min 8 characters)">
                            </div>
                            <button type="submit" class="cyber-button w-full mt-6">
                                <i class="fas fa-user-plus mr-2"></i>CREATE ACCOUNT
                            </button>
                        </form>
                        <div id="signupError" class="text-red-400 text-center text-sm hidden"></div>
                        <div class="text-center text-xs text-gray-500 pt-4">
                            <i class="fas fa-lock mr-1"></i> Your data is encrypted and secure
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
        const matrixArray = matrix.split("");
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for(let x = 0; x < columns; x++) { drops[x] = 1; }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'text-cyan-400');
                    b.classList.add('text-gray-400');
                });
                btn.classList.add('active', 'text-cyan-400');
                document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
                document.getElementById(`${tab}-form`).classList.remove('hidden');
            });
        });
        
        // Login handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const button = e.target.querySelector('button');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>AUTHENTICATING...';
            button.disabled = true;
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await response.json();
                if (data.success) {
                    button.innerHTML = '<i class="fas fa-check mr-2"></i>SUCCESS! REDIRECTING...';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    const errorDiv = document.getElementById('loginError');
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                    button.innerHTML = originalText;
                    button.disabled = false;
                    setTimeout(() => errorDiv.classList.add('hidden'), 3000);
                }
            } catch (error) {
                const errorDiv = document.getElementById('loginError');
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
                button.innerHTML = originalText;
                button.disabled = false;
            }
        });
        
        // Signup handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('signupUsername').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            
            if (password.length < 8) {
                const errorDiv = document.getElementById('signupError');
                errorDiv.textContent = 'Password must be at least 8 characters!';
                errorDiv.classList.remove('hidden');
                setTimeout(() => errorDiv.classList.add('hidden'), 3000);
                return;
            }
            
            const button = e.target.querySelector('button');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>CREATING ACCOUNT...';
            button.disabled = true;
            
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, email, password})
                });
                const data = await response.json();
                if (data.success) {
                    button.innerHTML = '<i class="fas fa-check mr-2"></i>ACCOUNT CREATED! REDIRECTING...';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    const errorDiv = document.getElementById('signupError');
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                    button.innerHTML = originalText;
                    button.disabled = false;
                    setTimeout(() => errorDiv.classList.add('hidden'), 3000);
                }
            } catch (error) {
                const errorDiv = document.getElementById('signupError');
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
                button.innerHTML = originalText;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
